# To run this test songs' titles have to be unique

appId: com.eddyizm.tempus
---
- launchApp
- runFlow: ../helper_flows/server_login_helper.yaml

- tapOn:
    id: "discovery_text_view_clickable"
- assertVisible:
    id: "player_header_button"
    checked: true
- tapOn:
    id: "player_header_button"
- assertVisible:
    id: "player_header_button"
    checked: false

- copyTextFrom:
    id: "player_header_media_title_label"
- evalScript: ${output.titleBefore = maestro.copiedText}
- tapOn:
    id: "placeholder_right_view"
- copyTextFrom:
    id: "player_header_media_title_label"
- evalScript: ${output.titleAfter = maestro.copiedText}
- assertTrue: ${output.titleBefore != output.titleAfter}