# This test have a pre-condition -- "global 1" song should be not-favored when test starts

appId: com.eddyizm.tempus
---
- launchApp
- tapOn:
    id: "libraryFragment"
- tapOn:
    id: "music_folder_recycler_view"
- tapOn:
    id: "music_index_title_text_view"
    index: 2
- tapOn:
    id: "music_directory_title_text_view"
- tapOn: "global 1"
- tapOn:
    id: "placeholder_left_view"
- tapOn:
    id: "player_play_pause_placeholder_view"
- tapOn:
    id: "button_favorite"
- assertVisible:
    id: "button_favorite"
    checked: true
- tapOn:
    id: "button_favorite"
- assertVisible:
    id: "button_favorite"
    checked: false