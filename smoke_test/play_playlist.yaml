appId: com.eddyizm.tempus
---
- launchApp

- runFlow: ../helper_flows/server_login_helper.yaml
- runFlow: ../helper_flows/close_mini_player.yaml
- scrollUntilVisible:
    element: "playlist_tempus"
    visibilityPercentage: 100
    centerElement: true
- tapOn: "playlist_tempus"
- assertVisible:
    id: "song_cover_image_view"
- assertNotVisible:
    id: "play_pause_icon"
- tapOn:
    id: "playlist_page_play_button"
- assertVisible:
    id: "play_pause_icon"
